AWSTemplateFormatVersion: '2010-09-09'
Description: Private S3 bucket for CS361 G650-14 faculty evidence files.

Parameters:
  BucketName:
    Type: String
    Default: ''
    Description: Optional globally unique bucket name. Leave blank to let CloudFormation generate one.
  WebAppOrigin:
    Type: String
    Description: Exact web application origin, including scheme and port (for example http://localhost:5500).

Conditions:
  UseCustomBucketName: !Not [!Equals [!Ref BucketName, '']]

Resources:
  FacultyEvidenceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !If [UseCustomBucketName, !Ref BucketName, !Ref AWS::NoValue]
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Ref WebAppOrigin
            AllowedMethods:
              - PUT
              - GET
            AllowedHeaders:
              - '*'
            ExposedHeaders:
              - ETag
            MaxAge: 3000

Outputs:
  EvidenceBucketName:
    Description: Name of the private evidence bucket
    Value: !Ref FacultyEvidenceBucket
  EvidenceBucketArn:
    Description: ARN of the private evidence bucket
    Value: !GetAtt FacultyEvidenceBucket.Arn
